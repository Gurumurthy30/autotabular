[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlagent"
version = "0.1.0"
description = "CLI multi-agent ML engineer (LangGraph + one local/remote LLM)"
requires-python = ">=3.10"
dependencies = ["langgraph>=0.2", "pydantic>=2", "pandas", "numpy", "scikit-learn", "rich", "ollama", "pyyaml"]

[project.optional-dependencies]
boost = ["lightgbm", "xgboost", "catboost", "optuna"]
dev = ["pytest", "optuna", "lightgbm"]

[project.scripts]
mlagent = "mlagent.cli:main"

[tool.setuptools.packages.find]
include = ["mlagent*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "BLE001",  # Catching general Exception is intentional in resilience loops & diagnostics
    "S110",    # try-except-pass is intentional when ignoring corrupted or non-matching auxiliary files
    "S112",    # try-except-continue is intentional during column leak check scanning
    "PLW1510", # subprocess.run without check=True (return codes explicitly inspected)
    "DTZ005",  # datetime.datetime.now() without tz parameter
    "RUF100",  # Unused noqa directives across environments
]
