[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlagent"
version = "0.1.0"
description = "CLI multi-agent ML engineer (LangGraph + one local/remote LLM)"
requires-python = ">=3.10"
dependencies = ["langgraph>=0.2", "pydantic>=2", "pandas", "numpy", "scikit-learn", "rich", "ollama", "pyyaml"]

[project.optional-dependencies]
boost = ["lightgbm", "xgboost", "catboost", "optuna"]
dev = ["pytest", "optuna", "lightgbm"]

[project.scripts]
mlagent = "mlagent.cli:main"

[tool.setuptools.packages.find]
include = ["mlagent*"]
